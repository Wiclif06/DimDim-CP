<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments :: cabecalho(${titulo})}"></head>
<body>
<header th:replace="~{fragments :: topo}"></header>
<main>
    <h1 th:text="${titulo}">Pagamento</h1>

    <div class="aviso aviso-info" th:if="${#lists.isEmpty(clientes)}">
        Cadastre um <a th:href="@{/clientes/novo}">cliente</a> antes de registrar um pagamento.
    </div>

    <form class="formulario" th:action="${action}" th:object="${form}" method="post" novalidate>
        <div class="aviso aviso-erro" role="alert" th:if="${#fields.hasGlobalErrors()}">
            <span th:each="e : ${#fields.globalErrors()}" th:text="${e}">erro</span>
        </div>

        <div class="campo">
            <label for="clienteId">Cliente</label>
            <select id="clienteId" th:field="*{clienteId}">
                <option value="">Selecione...</option>
                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome} + ' (id ' + ${c.id} + ')'">Cliente</option>
            </select>
            <div class="erro-campo" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></div>
        </div>

        <div class="campo">
            <label for="descricao">Descrição</label>
            <input id="descricao" type="text" th:field="*{descricao}" maxlength="200" autocomplete="off">
            <div class="erro-campo" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
        </div>

        <div class="campo">
            <label for="valor">Valor (R$)</label>
            <input id="valor" type="number" step="0.01" min="0.01" th:field="*{valor}">
            <div class="erro-campo" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>
        </div>

        <div class="campo">
            <label for="metodo">Método</label>
            <select id="metodo" th:field="*{metodo}">
                <option value="">Selecione...</option>
                <option th:each="m : ${metodos}" th:value="${m}" th:text="${m}">PIX</option>
            </select>
            <div class="erro-campo" th:if="${#fields.hasErrors('metodo')}" th:errors="*{metodo}"></div>
        </div>

        <div class="campo">
            <label for="status">Status</label>
            <select id="status" th:field="*{status}">
                <option th:each="s : ${statusLista}" th:value="${s}" th:text="${s}">PENDENTE</option>
            </select>
        </div>

        <div class="botoes">
            <button class="btn" type="submit">Salvar</button>
            <a class="btn btn-neutro" th:href="@{/pagamentos}">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments :: rodape}"></footer>
</body>
</html>
