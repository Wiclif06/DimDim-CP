spring.application.name=dimdim

# Porta: o App Service injeta SERVER_PORT / WEBSITES_PORT (definidos pelo script 01)
server.port=${SERVER_PORT:8080}

# Conexao com o Azure SQL Database.
# NENHUM segredo fica no codigo: os valores vem de variaveis de ambiente (App Settings do App Service).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=5

# O schema e criado pelo script scripts/ddl_dimdim.sql (passo 02 do README)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=true

# Swagger UI em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Health check (usado pelo script de deploy)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
